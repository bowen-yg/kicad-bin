name: Build KiCad 10.0.5 Lite AppImage

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "10.0.5", "v10.0.5" ]
  workflow_dispatch:

# 赋予创建 GitHub Release 和上传产物的写入权限
permissions:
  contents: write

jobs:
  build-appimage:
    name: Build KiCad 10.0.5 (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: '10.0.5' # 若 tag 格式为 v10.0.5 请修改为 'v10.0.5'
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            gettext \
            file \
            wget \
            desktop-file-utils \
            python3 \
            libwxgtk3.2-dev \
            libgl-dev \
            libwxgtk-media3.2-dev \
            libwxgtk-gl3.2-1t64 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglew-dev \
            libglm-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libboost-all-dev \
            libocct-data-exchange-dev \
            libocct-foundation-dev \
            libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev \
            libocct-ocaf-dev \
            libocct-visualization-dev \
            libngspice0-dev \
            libnng-dev \
            protobuf-compiler \
            libprotobuf-dev \
            libspnav-dev \
            libcairo2-dev \
            libpixman-1-dev \
            libgit2-dev \
            libpoppler-glib-dev \
            libsecret-1-dev \
            unixodbc-dev \
            zlib1g-dev \
            libzstd-dev \
            libharfbuzz-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu24.04-kicad10.0.5-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24.04-kicad10.0.5-

      - name: Configure CMake
        run: |
          mkdir -p build/linux
          cd build/linux
          cmake \
            -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKICAD_SCRIPTING_WXPYTHON=OFF \
            -DKICAD_STDLIB_LIGHT_DEBUG=OFF \
            -DKICAD_USE_OCC=ON \
            -DKICAD_SPICE=OFF \
            -DKICAD_BUILD_I18N=ON \
            -DKICAD_BUILD_PNS_DEBUG_TOOL=OFF \
            -DKICAD_BUILD_QA_TESTS=OFF \
            ../../

      - name: Build KiCad
        run: |
          cd build/linux
          export CCACHE_DIR=$HOME/.cache/ccache
          ninja

      - name: Install to AppDir
        run: |
          cd build/linux
          DESTDIR=${{ github.workspace }}/AppDir ninja install

      - name: Package AppImage
        run: |
          # 下载 linuxdeploy 打包工具
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy

          # 生成 AppImage
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/kicad \
            --desktop-file AppDir/usr/share/applications/org.kicad.kicad.desktop \
            --output appimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiCad-10.0.5-Lite-x86_64.AppImage
          path: "*.AppImage"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v10.0.5-lite' }}
          name: KiCad 10.0.5 Lite AppImage
          body: |
            KiCad 10.0.5 Lite 自动化构建成品（基于 Ubuntu 24.04）。
            - 无 3D 模型库
            - 无 Python 脚本集成
          draft: false
          prerelease: false
          files: "*.AppImage"
