name: Build KiCad 10.0.5 Lite AppImage

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:

    runs-on: ubuntu-24.04

    env:
      BUILD_TYPE: Release

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    ####################################################################
    # Dependencies
    ####################################################################

    - name: Enable Universe Repository
      run: |
        sudo add-apt-repository universe
        sudo apt-get update

    - name: Install Build Dependencies
      run: |
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          git \
          wget \
          curl \
          pkg-config \
          python3 \
          gettext \
          libwxgtk3.2-dev \
          libgtk-3-dev \
          libgl-dev \
          libglu1-mesa-dev \
          libglew-dev \
          libglm-dev \
          libboost-all-dev \
          libcairo2-dev \
          libssl-dev \
          libcurl4-openssl-dev \
          libgit2-dev \
          libngspice0-dev \
          libocct-data-exchange-dev \
          libocct-foundation-dev \
          libocct-modeling-algorithms-dev \
          libocct-modeling-data-dev \
          libocct-ocaf-dev \
          libocct-visualization-dev \
          zlib1g-dev

    ####################################################################
    # wxWidgets verification
    ####################################################################

    - name: Verify wxWidgets
      run: |
        which wx-config

        wx-config --version
        wx-config --selected-config

        wx-config --cxxflags
        wx-config --libs
    - name: Debug wxWidgets
      run: |
        wx-config --version
        wx-config --libs

        wx-config --libs std

        wx-config --libs gl
        wx-config --libs stc
        wx-config --libs webview

        dpkg -l | grep wx

    ####################################################################
    # Configure
    ####################################################################
    - name: Install mold
      uses: rui314/setup-mold@v1
      
    - name: Configure KiCad Lite
      run: |
        rm -rf build

        cmake \
          -S . \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DwxWidgets_CONFIG_EXECUTABLE=/usr/bin/wx-config \
          -DKICAD_BUILD_QA_TESTS=OFF \
          -DKICAD_INSTALL_DEMOS=OFF \
          -DKICAD_SIGNAL_INTEGRITY=OFF \
          -DKICAD_UPDATE_CHECK=OFF \
          -DKICAD_IDF_TOOLS=OFF \
          -DKICAD_SCRIPTING=OFF \
          -DKICAD_SCRIPTING_MODULES=OFF \
          -DKICAD_SCRIPTING_WXPYTHON=OFF \
          -DKICAD_SCRIPTING_ACTION_MENU=OFF \
          -DKICAD_INSTALL_DEMOS=OFF \
          -DKICAD_BUILD_QA_TESTS=OFF

    ####################################################################
    # Build
    ####################################################################

    - name: Build
      run: |
        cmake --build build --parallel $(nproc)

    ####################################################################
    # Install
    ####################################################################

    - name: Install
      run: |
        DESTDIR=$PWD/AppDir \
        cmake --install build

    ####################################################################
    # Remove unwanted files
    ####################################################################

    - name: Strip Lite Version
      run: |

        rm -rf AppDir/usr/share/kicad/demos || true

        rm -rf AppDir/usr/share/kicad/template || true

        rm -rf AppDir/usr/share/kicad/3dmodels || true

        rm -rf AppDir/usr/lib/python* || true

        find AppDir -name "*.a" -delete || true
        find AppDir -name "*.la" -delete || true

    ####################################################################
    # Download linuxdeploy
    ####################################################################

    - name: Download linuxdeploy
      run: |
        wget -O linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

        chmod +x linuxdeploy.AppImage

    ####################################################################
    # Build AppImage
    ####################################################################

    - name: Create AppImage
      run: |

        ARCH=x86_64 \
        ./linuxdeploy.AppImage \
          --appdir AppDir \
          --output appimage

    ####################################################################
    # Rename
    ####################################################################

    - name: Rename Output
      run: |

        APPIMAGE=$(find . -name "*.AppImage" | head -n 1)

        mv "$APPIMAGE" \
          KiCad-10.0.5-Lite-x86_64.AppImage

    ####################################################################
    # Upload Artifact
    ####################################################################

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KiCad-10.0.5-Lite
        path: KiCad-10.0.5-Lite-x86_64.AppImage

    ####################################################################
    # Release
    ####################################################################

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: KiCad-10.0.5-Lite-x86_64.AppImage
