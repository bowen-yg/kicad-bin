name: Build KiCad Lite AppImage

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache pkg-config \
            python3 gettext protobuf-compiler \
            libpoppler-dev libpoppler-glib-dev \
            libglm-dev libglew-dev zlib1g-dev libzstd-dev \
            libcurl4-openssl-dev libspnav-dev libcairo2-dev libpixman-1-dev \
            libgit2-dev libboost-all-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig1-dev libprotobuf-dev libnng-dev unixodbc-dev libsecret-1-dev \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev \
            libgtk-3-dev libgl-dev libglu1-mesa-dev \
            libngspice0-dev \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-ocaf-dev libocct-visualization-dev \
            patchelf file wget libfuse2t64

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu24.04-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24.04-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DwxWidgets_CONFIG_EXECUTABLE=/usr/bin/wx-config \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_SPICE_QA=OFF \
            -DKICAD_INSTALL_DEMOS=OFF \
            -DKICAD_BUILD_I18N=ON \
            -DKICAD_SIGNAL_INTEGRITY=OFF \
            -DKICAD_UPDATE_CHECK=OFF \
            -DKICAD_USE_SENTRY=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: CCache stats
        if: always()
        run: ccache --show-stats

      - name: Install to AppDir
        run: |
          rm -rf AppDir

          DESTDIR="$GITHUB_WORKSPACE/AppDir" \
            cmake --install build --strip

          test -x AppDir/usr/bin/kicad
          test -d AppDir/usr/lib
          test -d AppDir/usr/share/applications

          rm -rf AppDir/usr/share/kicad/demos
          rm -rf AppDir/usr/share/kicad/3dmodels
          rm -rf AppDir/usr/share/kicad/packages3d

          find AppDir -type f \( -name '*.a' -o -name '*.la' \) -delete

      - name: Build AppImage
        shell: bash
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage

          DESKTOP_FILE="$(find AppDir/usr/share/applications \
            -type f \
            \( -iname 'org.kicad.KiCad.desktop' -o -iname 'kicad.desktop' \) \
            -print -quit)"

          ICON_FILE="$(find AppDir/usr/share/icons AppDir/usr/share/kicad \
            \( -type f -o -type l \) \
            \( -iname 'kicad.svg' \
               -o -iname 'kicad.png' \
               -o -iname 'org.kicad.KiCad.svg' \
               -o -iname 'org.kicad.KiCad.png' \) \
            2>/dev/null | head -n1)"

          test -n "$DESKTOP_FILE"
          test -n "$ICON_FILE"

          APPDIR_LIBRARY_PATH="$(
            find AppDir/usr/lib \
              \( -type f -o -type l \) \
              -name '*.so*' \
              -printf '%h\n' \
            | sort -u \
            | paste -sd: -
          )"

          test -n "$APPDIR_LIBRARY_PATH"

          export LD_LIBRARY_PATH="$APPDIR_LIBRARY_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          echo "Desktop file: $DESKTOP_FILE"
          echo "Icon file: $ICON_FILE"
          echo "AppDir library directories:"
          printf '%s\n' "${APPDIR_LIBRARY_PATH//:/$'\n'}"

          ARGS=(
            --appdir AppDir
            --desktop-file "$DESKTOP_FILE"
            --icon-file "$ICON_FILE"
          )

          while IFS= read -r exe; do
            ARGS+=(--executable "$exe")
          done < <(
            find AppDir/usr/bin -maxdepth 1 \
              -type f \
              -perm -111 \
              ! -name '*.kiface' \
              | sort
          )

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./linuxdeploy.AppImage "${ARGS[@]}" --output appimage

          GENERATED="$(find . -maxdepth 1 \
            -type f \
            -name '*.AppImage' \
            ! -name 'linuxdeploy.AppImage' \
            -print -quit)"

          test -n "$GENERATED"

          OUTPUT="KiCad-Lite-${GITHUB_REF_NAME}-x86_64.AppImage"

          mv -- "$GENERATED" "$OUTPUT"
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

          echo "Created: $OUTPUT"
          ls -lh "$OUTPUT" "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiCad-Lite-AppImage
          path: |
            KiCad-Lite-*.AppImage
            KiCad-Lite-*.AppImage.sha256
          compression-level: 0

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KiCad-Lite-*.AppImage
            KiCad-Lite-*.AppImage.sha256
          generate_release_notes: true
